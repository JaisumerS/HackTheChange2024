---
- name: Deploy Full-Stack EmpowerNest to Kubernetes
  hosts: test
  become: true
  gather_facts: false

  tasks:
    - name: Transfer and execute the Kubernetes deployment script
      ansible.builtin.script: ./deploy-k8s-app.sh
      register: script_output

    - name: Display deployment execution logs
      ansible.builtin.debug:
        msg: "{{ script_output.stdout_lines | default([]) }}"
      when: not ansible_check_mode